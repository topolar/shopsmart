name: shopsmart

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: shopsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopsmart
      POSTGRES_USER: shopsmart_app
      POSTGRES_PASSWORD: ${SHOPSMART_POSTGRES_PASSWORD:?set SHOPSMART_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${SHOPSMART_POSTGRES_PORT:-57432}:5432"
    volumes:
      - shopsmart_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsmart_app -d shopsmart"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  shopsmart_pgdata:
    name: shopsmart_pgdata
